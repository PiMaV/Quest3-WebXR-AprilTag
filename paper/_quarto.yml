project:
  type: default
  output-dir: _site
  render:
    - index.qmd
    - overview.qmd
    - 01-calibration.qmd
    - 02-world-origin.qmd
    - 03-single-tag.qmd
    - 04-multi-tag-focus.qmd
    - 05-hand-coupling.qmd
    - 06-prediction.qmd
    - 07-trajectory-correction.qmd
    - 08-perimeter.qmd
    - bewegter-tag.qmd
    - uebersicht.qmd
    - 01-kalibrierung.qmd
    - 02-raumursprung.qmd
    - 03-einzelmarker.qmd
    - 04-mehrmarker-fokus.qmd
    - 05-handkopplung.qmd
    - 06-praediktion.qmd
    - 07-bahnkorrektur.qmd
    - 08-tischkontur.qmd

lang: en
format:
  html:
    theme:
      dark: [darkly, _theme-fonts.scss]
      light: [default, _theme-fonts.scss]
    respect-user-color-scheme: false
    include-after-body: _local-theme.html
    toc: true
    toc-location: left
    toc-depth: 2
    code-fold: true
    code-summary: Show model code
    embed-resources: true
    html-math-method: mathml
    fig-align: center
    include-in-header:
      text: |
        <style>
        body {
          --paper-ink: #183449; --paper-panel: #fff; --paper-border: #b9cace;
          --paper-muted: #455c67; --paper-teal: #006d70; --paper-crop: #944c12;
          --paper-next: #423780; --paper-plot: #edf3f4; --paper-grid: #d1dfe1;
          --paper-shade: #dfaa68; color-scheme: light;
        }
        body.quarto-dark {
          --paper-ink: #e3eef3; --paper-panel: #202a30; --paper-border: #546770;
          --paper-muted: #b0c6d0; --paper-teal: #74ddd2; --paper-crop: #ffbc79;
          --paper-next: #c0afff; --paper-plot: #172229; --paper-grid: #35464e;
          --paper-shade: #ae773e; color-scheme: dark;
        }
        main h1.title, main h2 { color: var(--paper-ink); }
        main h1.title { line-height: 1.12; text-wrap: balance; }
        main p, main li { overflow-wrap: break-word; }
        .roi-demo { color: var(--paper-ink); background: var(--paper-panel); border: 1px solid var(--paper-border);
          border-radius: .55rem; padding: clamp(.7rem, 2.2vw, 1.3rem); margin-block: .55rem 1rem;
          font-family: system-ui, sans-serif; font-size: 1rem; }
        .roi-demo label { display: flex; align-items: baseline; justify-content: space-between;
          flex-wrap: wrap; gap: .2rem .8rem; font-weight: 650; }
        .roi-demo output, .roi-demo dd { font-variant-numeric: tabular-nums; }
        .roi-demo input { display: block; width: 100%; margin: .45rem 0 .85rem; accent-color: var(--paper-teal); }
        .roi-demo input:focus-visible { outline: 2px solid var(--paper-teal); outline-offset: 4px; }
        .roi-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(8.5rem, .4fr);
          align-items: start; gap: clamp(.7rem, 2vw, 1.25rem); }
        .roi-image { width: 100%; height: auto; border-radius: .25rem; display: block; }
        .roi-legend { list-style: none; padding: 0; margin: 0 0 1rem; }
        .roi-legend li { display: flex; align-items: center; gap: .45rem; margin: 0 0 .35rem;
          font-size: .84rem; line-height: 1.3; }
        .roi-legend i { width: .9rem; height: .9rem; flex: 0 0 .9rem; display: inline-grid;
          place-items: center; font-style: normal; line-height: 1; }
        .roi-demo dl { margin: 0; }
        .roi-demo dt { font-size: .78rem; font-weight: 500; color: var(--paper-muted); }
        .roi-demo dd { font-size: 1rem; font-weight: 650; line-height: 1.25; margin: 0 0 .5rem; }
        .roi-status { margin: .85rem 0 0; padding-top: .65rem; border-top: 1px solid var(--paper-border);
          font-size: .92rem; font-weight: 600; }
        @media (max-width: 650px) {
          .roi-body { grid-template-columns: 1fr; }
          .roi-legend { display: flex; flex-wrap: wrap; gap: .2rem .8rem; margin-bottom: .5rem; }
          .roi-demo dl { display: flex; flex-wrap: wrap; gap: 0 .9rem; }
        }
        </style>
