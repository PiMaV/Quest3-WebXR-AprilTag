<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minimal Quest 3 WebXR AprilTag Starter</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b0f14;
      color: #e8eef5;
      font: 15px/1.5 system-ui, -apple-system, sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 24px;
      border-radius: 16px;
      background: #121821;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 14px; color: #aab6c3; }
    label { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; }
    select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #1b2430;
      color: #f3f7fa;
      padding: 8px 14px;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: #0ea5e9; border-color: #38bdf8; color: #04131c; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0b0f14;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d6e4f0;
      font-size: 13px;
      word-break: break-word;
    }
    .links { margin-top: 14px; font-size: 13px; color: #94a3b8; display: flex; gap: 16px; }
    .links a { color: #38bdf8; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  </style>
</head>
<body>
  <main>
    <h1>Minimal WebXR + AprilTag Starter</h1>
    <p>Calibrates the Quest 3 camera, locks a native <code>XRAnchor</code> onto the 3-tag L-angle, and places a 3D reference cube at physical origin <code>(0, 0, 0)</code>.</p>

    <label>
      Target L-Angle:
      <select id="rigSelect">
        <option value="a4">Printed DIN A4 (350 / 351 / 352)</option>
        <option value="tablet">Tablet / e-Ink (370 / 371 / 372)</option>
      </select>
    </label>

    <label>
      <input id="trackLoose" type="checkbox">
      Keep camera running after anchor lock to track loose tags (e.g. 200–249, 300–349)
    </label>

    <div class="row">
      <button id="enter" class="primary" disabled>Enter AR</button>
      <button id="end" hidden>End AR</button>
      <button id="recalibrate">Recalibrate</button>
    </div>

    <p id="status" class="status" role="status">Initializing…</p>

    <div class="links">
      <a href="./target.html">1:1 Screen / Tablet Target</a>
      <a href="./quest.html">Full Quest 3 Demo</a>
    </div>
  </main>

  <video id="video" playsinline muted hidden></video>
  <canvas id="canvas"></canvas>
  <script type="module" src="./minimal.mjs"></script>
</body>
</html>
